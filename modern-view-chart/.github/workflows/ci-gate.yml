name: CI Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-critical-and-build:
    name: lint:critical + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint:critical
        run: npm run lint:critical

      - name: Run build
        run: npm run build
