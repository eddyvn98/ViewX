name: Chart Live Soak

on:
  workflow_dispatch:
    inputs:
      ws_url:
        description: Live WebSocket URL (wss://...)
        required: false
        default: 'wss://api.vivutrade.io.vn'
        type: string
      api_url:
        description: Live API base URL (https://...)
        required: false
        default: 'https://api.vivutrade.io.vn'
        type: string
      clients:
        description: Concurrent WebSocket clients
        required: false
        default: '50'
        type: string
      duration_sec:
        description: Soak duration in seconds
        required: false
        default: '900'
        type: string
      ramp_sec:
        description: Client ramp duration in seconds
        required: false
        default: '60'
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chart-live-soak.yml'
      - 'modern-view-chart/backend/**'
      - 'modern-view-chart/scripts/server/ws-soak-test.mjs'
      - 'modern-view-chart/src/hooks/use-websocket/**'
      - 'modern-view-chart/src/lib/store/slices/data-slice.ts'
  schedule:
    - cron: '30 18 * * 0'

concurrency:
  group: chart-live-soak
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: modern-view-chart
    env:
      SOAK_WS_URL: ${{ github.event.inputs.ws_url || vars.VIEWX_SOAK_WS_URL || 'wss://api.vivutrade.io.vn' }}
      SOAK_API_URL: ${{ github.event.inputs.api_url || vars.VIEWX_SOAK_API_URL || 'https://api.vivutrade.io.vn' }}
      SOAK_CLIENTS: ${{ github.event.inputs.clients || '50' }}
      SOAK_DURATION_SEC: ${{ github.event.inputs.duration_sec || '900' }}
      SOAK_RAMP_SEC: ${{ github.event.inputs.ramp_sec || '60' }}
      ACCESS_TOKEN: ${{ secrets.VIEWX_SOAK_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modern-view-chart/package-lock.json

      - name: Use short gate on push
        if: github.event_name == 'push'
        run: |
          echo "SOAK_CLIENTS=20" >> "$GITHUB_ENV"
          echo "SOAK_DURATION_SEC=120" >> "$GITHUB_ENV"
          echo "SOAK_RAMP_SEC=20" >> "$GITHUB_ENV"

      - name: Validate live target
        run: |
          test -n "$SOAK_WS_URL"
          test -n "$SOAK_API_URL"

      - name: Install dependencies
        run: npm ci

      - name: Run public live connectivity soak
        env:
          ACCESS_TOKEN: ''
        run: |
          mkdir -p logs
          npm run soak:ws -- \
            --ws-url "$SOAK_WS_URL" \
            --api-url "$SOAK_API_URL" \
            --clients "$SOAK_CLIENTS" \
            --duration-sec "$SOAK_DURATION_SEC" \
            --ramp-sec "$SOAK_RAMP_SEC" \
            --require-metrics false \
            --output logs/chart-live-public-soak.json

      - name: Run authenticated WebSocket auth smoke
        if: env.ACCESS_TOKEN != ''
        run: npm run smoke:ws-auth -- --ws-url "$SOAK_WS_URL"

      - name: Run authenticated live WebSocket soak
        if: env.ACCESS_TOKEN != ''
        run: |
          npm run soak:ws -- \
            --ws-url "$SOAK_WS_URL" \
            --api-url "$SOAK_API_URL" \
            --clients "$SOAK_CLIENTS" \
            --duration-sec "$SOAK_DURATION_SEC" \
            --ramp-sec "$SOAK_RAMP_SEC" \
            --require-metrics true \
            --output logs/chart-live-authenticated-soak.json

      - name: Record missing authenticated-soak credential
        if: env.ACCESS_TOKEN == ''
        run: |
          echo "::warning::VIEWX_SOAK_ACCESS_TOKEN is not configured; public live soak ran, authenticated soak was not executed."
          printf '%s\n' '{"authenticated_soak":"not_run","reason":"VIEWX_SOAK_ACCESS_TOKEN_missing"}' > logs/chart-live-auth-status.json

      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-live-soak-report
          path: |
            modern-view-chart/logs/chart-live-public-soak.json
            modern-view-chart/logs/chart-live-authenticated-soak.json
            modern-view-chart/logs/chart-live-auth-status.json
            modern-view-chart/logs/ws-auth-smoke-*.json
          if-no-files-found: warn
          retention-days: 30
