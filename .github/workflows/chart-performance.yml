name: Chart Performance Gate

on:
  pull_request:
    paths:
      - 'modern-view-chart/**'
      - '.github/workflows/chart-performance.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'modern-view-chart/**'
      - '.github/workflows/chart-performance.yml'

concurrency:
  group: chart-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: modern-view-chart

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modern-view-chart/package-lock.json

      - name: Repair lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Upload repaired lockfile
        uses: actions/upload-artifact@v4
        with:
          name: chart-performance-lockfile
          path: modern-view-chart/package-lock.json
          retention-days: 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build E2E application
        env:
          NEXT_PUBLIC_E2E: '1'
          NEXT_PUBLIC_STRATEGY_ENGINE_ENABLED: 'false'
        run: npm run build

      - name: Start application
        env:
          NEXT_PUBLIC_E2E: '1'
          NEXT_PUBLIC_STRATEGY_ENGINE_ENABLED: 'false'
        run: |
          npm run start:3000 > /tmp/viewx-next.log 2>&1 &
          echo $! > /tmp/viewx-next.pid

      - name: Wait for chart route
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/en/chart > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/viewx-next.log
          exit 1

      - name: Run chart stress suite
        env:
          CI: '1'
        run: npx playwright test tests/chart-stress.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-performance-playwright
          path: |
            modern-view-chart/playwright-report
            modern-view-chart/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-performance-server-log
          path: /tmp/viewx-next.log
          if-no-files-found: ignore
          retention-days: 7
