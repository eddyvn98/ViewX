name: CI Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-changed-and-build:
    name: lint:changed + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modern-view-chart/package-lock.json

      - name: Install dependencies
        working-directory: modern-view-chart
        run: npm ci

      - name: Run lint:changed
        working-directory: modern-view-chart
        run: npm run lint:changed

      - name: Run unit tests
        working-directory: modern-view-chart
        run: npm run test:unit

      - name: Run build
        working-directory: modern-view-chart
        run: npm run build

  lint-legacy:
    name: lint:legacy (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modern-view-chart/package-lock.json

      - name: Install dependencies
        working-directory: modern-view-chart
        run: npm ci

      - name: Run lint:legacy
        working-directory: modern-view-chart
        run: npm run lint:legacy
        continue-on-error: true

      - name: Compare lint:legacy with baseline
        if: always()
        working-directory: modern-view-chart
        run: npm run lint:legacy:delta
        continue-on-error: true

      - name: Publish lint:legacy delta to job summary
        if: always()
        working-directory: modern-view-chart
        run: |
          echo "## Lint Legacy Delta" >> $GITHUB_STEP_SUMMARY
          if [ -f .tmp/eslint-legacy-delta-summary.txt ]; then
            cat .tmp/eslint-legacy-delta-summary.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "Delta summary not available." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload lint:legacy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-legacy-report
          path: |
            modern-view-chart/.github/lint-legacy-baseline.json
            modern-view-chart/.tmp/eslint-legacy-report.json
            modern-view-chart/.tmp/eslint-legacy-metrics.json
            modern-view-chart/.tmp/eslint-legacy-summary.txt
            modern-view-chart/.tmp/eslint-legacy-delta.json
            modern-view-chart/.tmp/eslint-legacy-delta-summary.txt
